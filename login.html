<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Login do Usuário</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/log.css">
  <script defer src="script/login.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">

</head>

<body>
  <section>
    <main class="Log">
      <form id="loginForm">
        <div class="logo-container">
          <a href="index.html"> <img src="Imagem/Teste12.svg" alt="Logo Principal" class="Logolog"></a>
        </div>
        <h1>LOGIN USUÁRIO</h1>

        <div class="input-box">
           <input type="email" name="email" placeholder="E-mail" required>
          <svg class="lucide-shield-user" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
            <path d="M6.376 18.91a6 6 0 0 1 11.249.003" />
            <circle cx="12" cy="11" r="4" />
          </svg>
        </div>

        <div class="input-box">
          <input type="password" name="senha" placeholder="Senha" required>
          <svg class="lucide-lock-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>

        <div class="Relembre">
          <label>
            <input type="checkbox"> Lembrar senha
          </label>
          <a href="#">Esqueci senha</a>
        </div>

        <button type="submit" class="login-botao">Login</button>

        <div class="Registro-link">
          <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
      </form>
    </main>
  </section>

  <footer class="footer">
    <h3>Nos acompanhe nas redes sociais</h3>
    <div class="social-icons">
      <a href="https://www.instagram.com/pedro.hslimaadv?igsh=MW5xN3E5bnRwMjJxYw==" target="_blank"
        aria-label="Instagram">
        <img src="Imagem/" alt="Instagram">
      </a>
      <a href="https://wa.me/message/VWEU6PXCMWLFM1" target="_blank" aria-label="WhatsApp">
        <img src="Imagem/whatsapp.svg" alt="WhatsApp">
      </a>
      <a href="https://www.linkedin.com/in/seuPerfil" target="_blank" aria-label="LinkedIn">
        <img src="Imagem/linkedin.svg" alt="LinkedIn">
      </a>
    </div>
    <p>&copy; 2025 - Todos os direitos reservados.</p>
  </footer>

</body>

</html>
